name: CI

# ─── Sprint 18: validación en CI (corre UNA vez por PR — protocolo de un solo push) ──
# El `next build` de producción NO corre aquí: Vercel ya lo ejecuta en el deploy
# del PR y la cuota del plan gratuito es limitada. Este workflow cubre lo que
# Vercel NO cubre: typecheck estricto, lint y la suite de tests contra un
# Postgres real y desechable — cero riesgo para la BD local del proyecto ni
# para Supabase.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck · lint · tests (Postgres real)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: empresarial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PAYLOAD_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrst
      DATABASE_URI: postgresql://postgres:postgres@127.0.0.1:5432/empresarial_test
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/empresarial_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/empresarial_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck estricto (tsc --noEmit)
        run: pnpm typecheck

      - name: Lint (eslint)
        run: pnpm lint

      - name: Migraciones contra el Postgres de CI
        run: pnpm migrate

      - name: Suite de tests con ratchet de cobertura (unit + integración)
        # Sprint CI-5: la suite corre CON cobertura para que el RATCHET de
        # `coverage.thresholds` (vitest.config.ts) sea REAL — si la cobertura
        # cae por debajo del valor medido, el pipeline falla.
        run: pnpm test:coverage

      # ── Gates de seguridad y compilación (Sprint R1 · P2-S5-01/02) ──
      # Sprint R7: gate BLOQUEANTE. Las 2 vulns HIGH (sharp: libheif/libvips) se
      # cerraron con el bump OFICIAL de la dependencia DIRECTA sharp 0.34.2 ->
      # 0.35.4 (triage: bump directo > lockfile > override). Restan 5 moderate +
      # 2 low, todas transitivas de plugins oficiales de Payload, por DEBAJO del
      # umbral --audit-level high.
      - name: Auditoría de dependencias (pnpm audit)
        run: pnpm audit --audit-level high

      # Build ANTES de Vercel: detecta errores de compilación sin gastar la
      # cuota diaria de builds del plan gratuito (AGENTS.md §5.2).
      - name: Build de producción (payload build)
        run: pnpm build
