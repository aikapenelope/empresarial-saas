version: 2

# ─── Dependabot (Sprint CI-5) ───────────────────────────────────────────────
# GitHub Actions y `pnpm audit --audit-level high` (paso BLOQUEANTE del CI) ya
# cubren la señal de vulnerabilidades del día a día. Dependabot añade la
# actualización PROACTIVA de dependencias en PRs pequeños y revisables.
#
# ⚠️ Requiere habilitarlo una vez en el repositorio (es GRATIS en repos
# privados): Settings → Code security → "Dependabot alerts" y
# "Dependabot version updates". Sin ese clic, este archivo no hace nada.
#
# Nota: CodeQL / secret scanning NO se configuran porque este repositorio es
# PRIVADO y GitHub exige GitHub Advanced Security (de pago) para ambos; se
# verificó contra la API (403/404 "not enabled for this repository").
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # El ecosistema de Payload se mueve en bloque: versiones desparejadas de
      # @payloadcms/* rompen el admin. Agrupado = un solo PR revisable.
      payload:
        patterns:
          - 'payload'
          - '@payloadcms/*'
      # El resto de dependencias de desarrollo (incluido vitest/playwright).
      dev-dependencies:
        dependency-type: development
    ignore:
      # Un MAJOR de Payload se adopta A MANO: arrastra migraciones y cambios de
      # esquema, y este repo mantiene TODO el ecosistema en lockstep. Ignorar el
      # major SÓLO en el adapter dejaría al grupo proponer `payload@4` +
      # `@payloadcms/next@4` conservando `@payloadcms/db-postgres` en v3: justo el
      # desparejo de versiones que esta configuración quiere evitar (reporte
      # Devin #98). Se ignora el major para `payload` y para todo `@payloadcms/*`.
      - dependency-name: 'payload'
        update-types: ['version-update:semver-major']
      - dependency-name: '@payloadcms/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    # Igual que el ecosistema npm de arriba: UNA sola PR por ronda.
    # Sin agrupar, cada bump de Action abre su propia PR y dispara su propia
    # corrida de CI (4 bumps = 4 builds, y los minutos del plan gratuito los paga
    # el usuario). Además, las ramas individuales envejecen por separado: en la
    # ronda #101-#104 las cuatro quedaron atrás de `main` sin conflicto, así que
    # Dependabot no las rebasó y sus checks quedaron OBSOLETOS (el CI solo se
    # re-dispara con un push a la rama). Un grupo = un rebase, una corrida, un
    # merge.
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns:
          - '*'
